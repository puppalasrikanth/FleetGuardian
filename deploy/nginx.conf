server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA deep links (/harnesses, /runtime, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Measured / published audit JSON must not be cached aggressively during demos
    location ~* \.(json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
